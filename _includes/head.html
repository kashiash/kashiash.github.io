<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var seen = [];
      document.querySelectorAll('code.language-mermaid, .language-mermaid').forEach(function(block) {
        var wrapper = block.closest('div.language-mermaid') || block.closest('pre') || block;
        if (seen.indexOf(wrapper) !== -1) return;
        seen.push(wrapper);
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = block.textContent;
        wrapper.parentNode.replaceChild(div, wrapper);
      });
      if (typeof mermaid !== 'undefined') {
        mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
        mermaid.run();
      }
    });
  </script>
</head>
